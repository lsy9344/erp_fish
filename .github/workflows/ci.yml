name: CI
# 모든 검사는 Linux 자체 러너에서만 실행한다. 외부 fork PR은 자체 러너에 접근하지 못한다.

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: "Run the full Playwright suite"
        required: false
        type: boolean
        default: false
      run_burn_in:
        description: "Run the Playwright smoke burn-in loop"
        required: false
        type: boolean
        default: false
      e2e_grep:
        description: "Optional Playwright grep filter for manual full e2e"
        required: false
        type: string
        default: ""
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.31.0"
  AUTH_SECRET: test-auth-secret-at-least-32-characters
  DATABASE_URL: postgresql://postgres:erp_fish_local_pw@localhost:5432/erp_fish_e2e
  PLAYWRIGHT_DATABASE_URL: postgresql://postgres:erp_fish_local_pw@localhost:5432/erp_fish_e2e
  SKIP_ENV_VALIDATION: "1"
  PW_REUSE_EXISTING_SERVER: "0"

jobs:
  # Fast gate: runs on EVERY push to any branch (incl. feature branches) and on PRs.
  # Cheap, no DB, no browser, no build — gives ~1-2 min feedback on the common case.
  fast-checks:
    name: Fast Checks
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Check formatting
        run: pnpm format:check

      - name: Check CI YAML and docs formatting
        run: pnpm format:check:ci-docs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

  # Heavy build: only on PRs and on pushes to integration branches (staging/main).
  # Feature-branch pushes skip this — you build locally / it runs at merge time.
  build:
    name: Production Build
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    timeout-minutes: 25
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.js', 'package.json', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Create test env file
        run: |
          cat > .env <<EOF
          AUTH_SECRET="${AUTH_SECRET}"
          AUTH_TRUST_HOST="true"
          DATABASE_URL="${DATABASE_URL}"
          SEED_HQ_EMAIL="admin@example.com"
          SEED_HQ_PASSWORD="test-headquarters-password"
          SEED_HQ_NAME="CI Headquarters"
          SEED_STORE_MANAGER_EMAIL="store-manager@example.com"
          SEED_STORE_MANAGER_PASSWORD="test-store-manager-password"
          SEED_STORE_MANAGER_NAME="CI Store Manager"
          SEED_SAMPLE_STORE_NAME="CI Store"
          ALLOW_PRODUCTION_SEED=""
          ALLOW_SEED_PASSWORD_ROTATION=""
          EOF

      - name: Production build
        run: pnpm build

  api-tests:
    name: API Tests (${{ matrix.group }})
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    timeout-minutes: 15
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [chat, report-p0, report-rest, other]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_fish_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_fish_local_pw
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_fish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Set PostgreSQL connection
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          if [ -z "$POSTGRES_PORT" ]; then
            echo "PostgreSQL service did not publish a host port."
            exit 1
          fi
          echo "DATABASE_URL=postgresql://postgres:erp_fish_local_pw@127.0.0.1:${POSTGRES_PORT}/erp_fish_e2e" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_DATABASE_URL=postgresql://postgres:erp_fish_local_pw@127.0.0.1:${POSTGRES_PORT}/erp_fish_e2e" >> "$GITHUB_ENV"

      - name: Create test env file
        run: |
          cat > .env <<EOF
          AUTH_SECRET="${AUTH_SECRET}"
          AUTH_TRUST_HOST="true"
          DATABASE_URL="${DATABASE_URL}"
          SEED_HQ_EMAIL="admin@example.com"
          SEED_HQ_PASSWORD="test-headquarters-password"
          SEED_HQ_NAME="CI Headquarters"
          SEED_STORE_MANAGER_EMAIL="store-manager@example.com"
          SEED_STORE_MANAGER_PASSWORD="test-store-manager-password"
          SEED_STORE_MANAGER_NAME="CI Store Manager"
          SEED_SAMPLE_STORE_NAME="CI Store"
          ALLOW_PRODUCTION_SEED=""
          ALLOW_SEED_PASSWORD_ROTATION=""
          EOF

      - name: API tests
        env:
          API_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail

          case "$API_GROUP" in
            chat)
              API_ARGS=(tests/api/chat.spec.ts)
              ;;
            report-p0)
              API_ARGS=(tests/api/report-export.spec.ts --grep '\[P0\]')
              ;;
            report-rest)
              API_ARGS=(tests/api/report-export.spec.ts --grep-invert '\[P0\]')
              ;;
            other)
              mapfile -t API_ARGS < <(
                find tests/api -type f -name '*.spec.ts' \
                  ! -path 'tests/api/chat.spec.ts' \
                  ! -path 'tests/api/report-export.spec.ts' \
                  -print | sort
              )
              if [ "${#API_ARGS[@]}" -eq 0 ]; then
                echo "No API specs remain for the other group." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown API group: $API_GROUP" >&2
              exit 1
              ;;
          esac

          echo "Running API group: $API_GROUP"
          printf '  %s\n' "${API_ARGS[@]}"
          corepack pnpm test:playwright -- "${API_ARGS[@]}"

  playwright-smoke:
    name: Playwright Smoke ${{ matrix.group }}
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 25
    # Runs on PRs and on staging/main pushes the core/full jobs do NOT already cover.
    # Plain feature-branch pushes skip smoke entirely — that is the slow common case we removed.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && !inputs.run_full_e2e))
    env:
      DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
    strategy:
      fail-fast: false
      matrix:
        group: [ledger, hq, admin]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_fish_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_fish_local_pw
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_fish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Run representative e2e smoke
        run: pnpm test:e2e:smoke:${{ matrix.group }}

      - name: Upload Playwright artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  playwright-core:
    name: Playwright Core ${{ matrix.group }}
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 35
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' && github.ref == 'refs/heads/staging'
    strategy:
      fail-fast: false
      matrix:
        group: [ledger, hq, admin, imports]
    env:
      DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_fish_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_fish_local_pw
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_fish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Run core e2e group
        run: pnpm test:e2e:core:${{ matrix.group }}

      - name: Upload Playwright artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-core-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  playwright-full:
    name: Playwright Full ${{ matrix.shard }}
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 30
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_full_e2e) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')))
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_fish_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_fish_local_pw
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_fish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
      E2E_GREP: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_grep || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Run Playwright shard
        run: |
          echo "Running Playwright shard ${{ matrix.shard }}/4"
          # Security: inputs passed through env: to prevent script injection
          if [ -n "$E2E_GREP" ]; then
            pnpm test:playwright -- tests/e2e --grep "$E2E_GREP" --shard=${{ matrix.shard }}/4 --reporter=line
          else
            pnpm test:playwright -- tests/e2e --shard=${{ matrix.shard }}/4 --reporter=line
          fi

      - name: Upload Playwright artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  playwright-burn-in:
    name: Playwright Smoke Burn-In
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 35
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'workflow_dispatch' && inputs.run_burn_in
    env:
      DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e
      PLAYWRIGHT_DATABASE_URL: postgresql://postgres:erp_fish_local_pw@postgres:5432/erp_fish_e2e

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_fish_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_fish_local_pw
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_fish_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          dest: ${{ runner.temp }}/erp-fish-pnpm-setup

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        env:
          PNPM_STORE_DIR: ${{ runner.tool_cache }}/package-stores/${{ github.repository }}/${{ runner.os }}-${{ runner.arch }}/${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}/pnpm
        run: |
          echo "Using pnpm store: $PNPM_STORE_DIR"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --side-effects-cache=false

      - name: Run smoke burn-in
        run: pnpm test:playwright -- tests/e2e/auth.spec.ts:16 --repeat-each=10 --reporter=line

      - name: Upload Playwright artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-burn-in-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  notify-slack:
    name: Slack Notification
    runs-on: [self-hosted, Linux, X64, erp-dabi-linux]
    timeout-minutes: 5
    needs:
      - fast-checks
      - build
      - api-tests
      - playwright-smoke
      - playwright-core
      - playwright-full
      - playwright-burn-in
    if: >-
      always() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      REPOSITORY: ${{ github.repository }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}
      FAST_CHECKS_RESULT: ${{ needs.fast-checks.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      API_TESTS_RESULT: ${{ needs.api-tests.result }}
      PLAYWRIGHT_SMOKE_RESULT: ${{ needs.playwright-smoke.result }}
      PLAYWRIGHT_CORE_RESULT: ${{ needs.playwright-core.result }}
      PLAYWRIGHT_FULL_RESULT: ${{ needs.playwright-full.result }}
      PLAYWRIGHT_BURN_IN_RESULT: ${{ needs.playwright-burn-in.result }}
    steps:
      - name: Send Slack notification
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skipping Slack notification."
            exit 0
          fi

          overall="success"
          for result in "$FAST_CHECKS_RESULT" "$BUILD_RESULT" "$API_TESTS_RESULT" "$PLAYWRIGHT_SMOKE_RESULT" "$PLAYWRIGHT_CORE_RESULT" "$PLAYWRIGHT_FULL_RESULT" "$PLAYWRIGHT_BURN_IN_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              overall="failure"
            fi
          done

          if [ "$overall" = "success" ]; then
            icon=":white_check_mark:"
            status="CI passed"
            color="#2eb67d"
          else
            icon=":x:"
            status="CI failed"
            color="#e01e5a"
          fi

          short_sha="${COMMIT_SHA:0:7}"
          COMMIT_MESSAGE="${COMMIT_MESSAGE%%$'\n'*}"
          export icon status color short_sha

          payload="$(
            python3 -c '
          import json
          import os

          icon = os.environ["icon"]
          status = os.environ["status"]
          color = os.environ["color"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          short_sha = os.environ["short_sha"]
          commit_url = os.environ["COMMIT_URL"]
          run_url = os.environ["RUN_URL"]
          commit_message = os.environ["COMMIT_MESSAGE"]
          results = {
              "Fast Checks": os.environ["FAST_CHECKS_RESULT"],
              "Production Build": os.environ["BUILD_RESULT"],
              "API Tests": os.environ["API_TESTS_RESULT"],
              "Playwright Smoke": os.environ["PLAYWRIGHT_SMOKE_RESULT"],
              "Playwright Core": os.environ["PLAYWRIGHT_CORE_RESULT"],
              "Playwright Full": os.environ["PLAYWRIGHT_FULL_RESULT"],
              "Playwright Smoke Burn-In": os.environ["PLAYWRIGHT_BURN_IN_RESULT"],
          }

          fields = [
              {"title": "Repository", "value": repository, "short": True},
              {"title": "Branch", "value": branch, "short": True},
              {"title": "Commit", "value": f"<{commit_url}|{short_sha}> {commit_message}", "short": False},
              {"title": "Jobs", "value": "\n".join(f"{name}: {result}" for name, result in results.items()), "short": False},
          ]

          print(json.dumps({
              "text": f"{icon} {status}: {repository}@{branch} ({short_sha})",
              "attachments": [{
                  "color": color,
                  "fields": fields,
                  "actions": [{
                      "type": "button",
                      "text": "Open workflow run",
                      "url": run_url,
                  }],
              }],
          }))
          '
          )"

          curl -sS -X POST -H "Content-type: application/json" --data "$payload" "$SLACK_WEBHOOK_URL"
